root = "."
tmp_dir = "tmp"

[build]
  # Target the api folder, output to a specific api binary
  cmd = "go build -buildvcs=false -o ./tmp/api-bin ./cmd/api"
  bin = "./tmp/api-bin"

  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_regex = ["_test.go"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", ".git"]

  delay = 0
  exclude_unchanged = true
  poll = false

  send_interrupt = true
  kill_delay = "500ms"
  stop_on_error = true

[color]
  # Different colors so you can easily tell them apart in the terminal
  main = "blue"
  watcher = "cyan"
  build = "yellow"
  runner = "red"

[misc]
  clean_on_exit = true